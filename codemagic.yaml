# Codemagic -> TestFlight for Hollowmarch.
#
# The game is plain ES modules with no bundler, so "building the web app" is just
# assembling www/ (see tools/build-www.mjs). Everything after that is standard Capacitor
# iOS: sync the native project, fetch signing from App Store Connect, archive, upload.
#
# SETUP, already done -- recorded here because none of it lives in this file:
#   1. An App Store Connect API key (App Manager access) is registered in the Codemagic
#      UI as a Developer Portal integration named `Hollowmarch`. The name below has to
#      match it exactly; a mismatch fails the build before any script runs.
#   2. The app record exists in App Store Connect under bundle id
#      com.hollowmarch.app, Apple ID 6811036531.
#   3. A 2048-bit RSA key is stored as the secret variable CERTIFICATE_PRIVATE_KEY in the
#      variable group `ios_signing`. The signing certificate is bound to this key, so it
#      has to outlive any single build -- see the signing step.
#
# Signing is done through the App Store Connect API rather than from files uploaded to
# Codemagic, so there is nothing to re-upload when a certificate expires. Note that
# `environment.ios_signing` is not a shortcut for this: that setting only selects among
# signing files already uploaded to Codemagic, which is how the Stride workflow is set up.
#
# The ios/ directory is generated by `npx cap add ios`. It is not in the repo, so this
# workflow creates it on the build machine -- which also means the native project is
# always in sync with capacitor.config.json rather than drifting from a stale checkout.

workflows:
  ios-testflight:
    name: Hollowmarch iOS (TestFlight)
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Hollowmarch

    environment:
      groups:
        # Supplies CERTIFICATE_PRIVATE_KEY.
        - ios_signing
      vars:
        BUNDLE_ID: 'com.hollowmarch.app'
        # Numeric Apple ID from App Store Connect -> App Information.
        APP_STORE_APPLE_ID: 6811036531
      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Check the signing variables arrived
        script: |
          # A missing variable currently surfaces twenty minutes in, as an argparse usage
          # dump from a tool that says only "is not defined" -- not whether the name is
          # wrong, the group is wrong, or the group was never imported. Names only below;
          # no values are printed.
          echo "--- every variable name visible to this build ---"
          env | cut -d= -f1 | sort | tr '\n' ' '
          echo
          echo
          echo "--- the ones signing needs ---"
          for v in CERTIFICATE_PRIVATE_KEY APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY BUNDLE_ID APP_STORE_APPLE_ID; do
            if printenv "$v" > /dev/null 2>&1; then
              echo "ok       $v ($(printenv "$v" | wc -c | tr -d ' ') bytes)"
            else
              echo "MISSING  $v"
            fi
          done

          if ! printenv CERTIFICATE_PRIVATE_KEY > /dev/null 2>&1; then
            echo "" >&2
            echo "CERTIFICATE_PRIVATE_KEY did not reach the build." >&2
            echo "Compare the name against the list above: it must be spelled exactly that" >&2
            echo "way, and its variable group must be exactly ios_signing." >&2
            exit 1
          fi

      - name: Install dependencies
        script: |
          npm install

      - name: Sanity-check the game before packaging it
        script: |
          # Every module must parse. A syntax error here is a white screen on a phone
          # with no message anywhere, so it is worth ten seconds on the build machine.
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js

      - name: Build web assets
        script: |
          node tools/make-assets.mjs
          npm run build

      - name: Add the iOS platform
        script: |
          set -e
          # Generated rather than committed, so the native project can never drift out of
          # sync with capacitor.config.json.
          npx cap add ios

          # Capacitor 6's template targets iOS 13. Apple refuses uploads below 15.0 from
          # Spring 2027 and warns on every delivery until then (ITMS-90068). The floor is
          # written in two places and both have to move; raise them before `cap sync`
          # reinstalls the pods, or the pods keep the old target.
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            ios/App/App.xcodeproj/project.pbxproj

          npx cap sync ios

          # Declare up front that the app uses no encryption, rather than answering the
          # same question by hand in App Store Connect for every build. Accurate here: the
          # game makes no network requests of any kind and touches no crypto API, so there
          # is nothing to declare beyond the exemption.
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"

          echo "--- deployment target ---"
          grep -n 'platform :ios' ios/App/Podfile
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' ios/App/App.xcodeproj/project.pbxproj | sort -u

      - name: Generate app icons and launch images
        script: |
          # assets/ holds a 1024 icon and a 2732 launch image, both generated from source
          # by tools/make-assets.mjs. This expands them into the full iOS asset catalogue.
          npx @capacitor/assets generate --ios --assetPath assets

      - name: Set the build number
        script: |
          # This is also the first point at which APP_STORE_APPLE_ID is proved to name an
          # app record this key can read. The lookup used to be silenced and defaulted to
          # zero, so an unreachable record was indistinguishable from "no builds yet" and
          # only surfaced at the very end, as altool refusing the upload.
          # Codemagic's own build counter is the source of truth, because it only ever goes
          # up and needs nothing from Apple. Asking App Store Connect for the last
          # TestFlight build is the more obvious approach and it kept coming back empty,
          # which silently produced build 1 twice and a 409 from altool the second time.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>&1) || LATEST=""
          echo "latest TestFlight build for Apple ID $APP_STORE_APPLE_ID: ${LATEST:-<lookup failed>}"
          case "$LATEST" in '' | *[!0-9]* ) LATEST=0 ;; esac

          # Still take Apple's number into account when it is available: a repository moved
          # to another CI project would restart the counter and start colliding again.
          NEXT=$BUILD_NUMBER
          if [ "$NEXT" -le "$LATEST" ]; then
            NEXT=$((LATEST + 1))
          fi

          echo "building as $NEXT (codemagic counter $BUILD_NUMBER, apple says $LATEST)"
          cd ios/App
          agvtool new-version -all "$NEXT"

      - name: Fetch signing files and apply them
        script: |
          set -e
          keychain initialize

          # This creates the certificate and profile through the App Store Connect API.
          # `environment.ios_signing` is NOT an alternative to it: that setting fetches
          # signing files previously uploaded to Codemagic, and nothing is uploaded here.
          #
          # --certificate-key matters. Without it `--create` generates a throwaway key, so
          # the first build succeeds and leaves a certificate in the Developer Portal that
          # no later build can pair with -- "Cannot save Signing Certificates without
          # certificate private key". CERTIFICATE_PRIVATE_KEY comes from the `ios_signing`
          # variable group and has to outlive any single build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

          # `cap add ios` regenerates the Xcode project on every build, so its bundle
          # identifier is whatever Capacitor produced rather than something committed and
          # reviewed. If it does not match the profile fetched above, `use-profiles` has
          # nothing to apply -- and it only warns in that case, so the build sails on and
          # fails ten minutes later inside xcodebuild as "App requires a provisioning
          # profile", which names neither the mismatch nor the step that caused it.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" \
            ios/App/App.xcodeproj/project.pbxproj

          echo "--- bundle identifiers in the generated project ---"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' ios/App/App.xcodeproj/project.pbxproj | sort -u

          xcode-project use-profiles --code-signing-setup-verbose-logging

          echo "--- signing settings that reached the project ---"
          grep -E -o '(PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE) = [^;]*' \
            ios/App/App.xcodeproj/project.pbxproj | sort -u

          # Fail here, where the cause is on screen, rather than in the archive.
          if ! grep -q PROVISIONING_PROFILE_SPECIFIER ios/App/App.xcodeproj/project.pbxproj; then
            echo "No provisioning profile was applied to the project -- see the two listings above." >&2
            exit 1
          fi

      - name: Archive
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add a group name here once you have created one in App Store Connect, e.g.
        #   beta_groups:
        #     - Hollowmarch Testers
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
