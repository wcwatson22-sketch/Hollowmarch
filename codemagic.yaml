# Codemagic -> TestFlight for Hollowmarch.
#
# The game is plain ES modules with no bundler, so "building the web app" is just
# assembling www/ (see tools/build-www.mjs). Everything after that is standard Capacitor
# iOS: sync the native project, fetch signing from App Store Connect, archive, upload.
#
# SETUP, already done -- recorded here because none of it lives in this file:
#   1. An App Store Connect API key (App Manager access) is registered in the Codemagic
#      UI as a Developer Portal integration named `Hollowmarch`. The name below has to
#      match it exactly; a mismatch fails the build before any script runs.
#   2. The app record exists in App Store Connect under bundle id
#      com.clearpathdigital.hollowmarch, Apple ID 6811036531.
#   3. A 2048-bit RSA key is stored as the secret variable CERTIFICATE_PRIVATE_KEY in the
#      variable group `ios_signing`. The signing certificate in the Developer Portal is
#      bound to this key, so it has to outlive any single build -- see the signing step.
#
# The ios/ directory is generated by `npx cap add ios`. It is not in the repo, so this
# workflow creates it on the build machine -- which also means the native project is
# always in sync with capacitor.config.json rather than drifting from a stale checkout.

workflows:
  ios-testflight:
    name: Hollowmarch iOS (TestFlight)
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Hollowmarch

    environment:
      groups:
        # Supplies CERTIFICATE_PRIVATE_KEY.
        - ios_signing
      vars:
        BUNDLE_ID: 'com.clearpathdigital.hollowmarch'
        # Numeric Apple ID from App Store Connect -> App Information.
        APP_STORE_APPLE_ID: 6811036531
      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sanity-check the game before packaging it
        script: |
          # Every module must parse. A syntax error here is a white screen on a phone
          # with no message anywhere, so it is worth ten seconds on the build machine.
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js

      - name: Build web assets
        script: |
          node tools/make-assets.mjs
          npm run build

      - name: Add the iOS platform
        script: |
          # Generated rather than committed, so the native project can never drift out of
          # sync with capacitor.config.json.
          npx cap add ios
          npx cap sync ios

      - name: Generate app icons and launch images
        script: |
          # assets/ holds a 1024 icon and a 2732 launch image, both generated from source
          # by tools/make-assets.mjs. This expands them into the full iOS asset catalogue.
          npx @capacitor/assets generate --ios --assetPath assets

      - name: Set the build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))

      - name: Fetch signing files and apply them
        script: |
          set -e
          keychain initialize

          # The certificate has to be bound to a key that outlives the build. Without
          # --certificate-key, `--create` generates a throwaway key, and every later build
          # fetches the certificate it left behind in the Developer Portal with no key to
          # pair it with -- "Cannot save Signing Certificates without certificate private
          # key". CERTIFICATE_PRIVATE_KEY comes from the `ios_signing` variable group.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

          # `cap add ios` regenerates the Xcode project on every build, so its bundle
          # identifier is whatever Capacitor produced rather than something committed and
          # reviewed. If it does not match the profile fetched above, `use-profiles` has
          # nothing to apply -- and it only warns in that case, so the build sails on and
          # fails ten minutes later inside xcodebuild as "App requires a provisioning
          # profile", which names neither the mismatch nor the step that caused it.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" \
            ios/App/App.xcodeproj/project.pbxproj

          echo "--- bundle identifiers in the generated project ---"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' ios/App/App.xcodeproj/project.pbxproj | sort -u

          xcode-project use-profiles --code-signing-setup-verbose-logging

          echo "--- signing settings that reached the project ---"
          grep -E -o '(PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE) = [^;]*' \
            ios/App/App.xcodeproj/project.pbxproj | sort -u

          # Fail here, where the cause is on screen, rather than in the archive.
          if ! grep -q PROVISIONING_PROFILE_SPECIFIER ios/App/App.xcodeproj/project.pbxproj; then
            echo "No provisioning profile was applied to the project -- see the two listings above." >&2
            exit 1
          fi

      - name: Archive
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add a group name here once you have created one in App Store Connect, e.g.
        #   beta_groups:
        #     - Hollowmarch Testers
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
